<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>llmdoc viewer</title>
  <link rel="stylesheet" href="/assets/viewer.css" />
  <script src="/assets/marked.js"></script>
  <script type="module" src="/assets/viewer-app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>llmdoc <span class="repo" id="repo"></span></h1>
    <div class="health-strip" aria-label="知识面状态">
      <span class="chip" id="stat-docs"></span>
      <span class="chip" id="stat-baseline"></span>
      <span class="chip" id="stat-validate"></span>
      <span class="chip" id="stat-delta"></span>
    </div>
    <button class="chip button" id="refresh" type="button" aria-label="刷新知识面">↻ 刷新</button>
    <div class="toggle" role="group" aria-label="图谱显示模式">
      <button id="mode-topics" type="button">Topics 拓扑</button>
      <button id="mode-docs" type="button">Documents 全图</button>
    </div>
  </header>

  <div id="load-error" class="load-error" role="alert" hidden></div>

  <main>
    <nav id="sidebar" aria-label="llmdoc 文档列表">
      <label class="search-box">
        <span class="sr-only">过滤文档</span>
        <input id="search" type="search" placeholder="过滤路径、标题或描述" autocomplete="off" />
        <kbd>/</kbd>
      </label>
      <div id="doc-list"></div>
    </nav>

    <section id="graph-wrap" aria-label="知识关系图">
      <svg id="graph" role="application" tabindex="0" aria-label="知识关系图；可拖动画布、滚轮缩放，按 0 重置视图"></svg>
      <div id="graph-hint" aria-live="polite"></div>
      <div id="graph-toolbar" role="group" aria-label="图谱缩放控制">
        <button id="zoom-out" type="button" title="缩小">−</button>
        <button id="zoom-reset" type="button" title="重置视图">适应</button>
        <button id="zoom-in" type="button" title="放大">＋</button>
      </div>
      <div id="legend" aria-label="图例"></div>
      <div id="graph-empty" hidden>没有可显示的文档</div>
    </section>

    <aside id="detail" aria-label="文档详情">
      <button id="detail-close" type="button" aria-label="关闭详情">×</button>
      <div class="inner"><div class="placeholder">选择一个 topic 或文档查看详情</div></div>
    </aside>
  </main>
</body>
</html>

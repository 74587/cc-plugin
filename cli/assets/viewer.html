<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>llmdoc viewer</title>
  <link rel="stylesheet" href="/assets/viewer.css" />
  <script src="/assets/marked.js"></script>
  <script type="module" src="/assets/viewer-app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>llmdoc <span class="repo" id="repo"></span></h1>
    <div class="health-strip" aria-label="Knowledge status">
      <span class="chip" id="stat-docs"></span>
      <span class="chip" id="stat-baseline"></span>
      <span class="chip" id="stat-validate"></span>
      <span class="chip" id="stat-delta"></span>
    </div>
    <button class="chip button" id="refresh" type="button" aria-label="Refresh knowledge">↻ Refresh</button>
    <div class="toggle" role="group" aria-label="Graph display mode">
      <button id="mode-topics" type="button">Topic topology</button>
      <button id="mode-docs" type="button">All documents</button>
    </div>
  </header>

  <div id="load-error" class="load-error" role="alert" hidden></div>

  <main>
    <nav id="sidebar" aria-label="llmdoc document list">
      <label class="search-box">
        <span class="sr-only">Filter documents</span>
        <input id="search" type="search" placeholder="Filter by path, title, or description" autocomplete="off" />
        <kbd>/</kbd>
      </label>
      <div id="doc-list"></div>
    </nav>

    <section id="graph-wrap" aria-label="Knowledge relationship graph">
      <svg id="graph" role="application" tabindex="0" aria-label="Knowledge graph; drag to pan, scroll to zoom, press 0 to reset"></svg>
      <div id="graph-hint" aria-live="polite"></div>
      <div id="graph-toolbar" role="group" aria-label="Graph zoom controls">
        <button id="zoom-out" type="button" title="Zoom out">−</button>
        <button id="zoom-reset" type="button" title="Reset view">Fit</button>
        <button id="zoom-in" type="button" title="Zoom in">＋</button>
      </div>
      <div id="legend" aria-label="Legend"></div>
      <div id="graph-empty" hidden>No documents to display</div>
    </section>

    <aside id="detail" aria-label="Document details">
      <button id="detail-close" type="button" aria-label="Close details">×</button>
      <div class="inner"><div class="placeholder">Select a topic or document to view details</div></div>
    </aside>
  </main>
</body>
</html>
